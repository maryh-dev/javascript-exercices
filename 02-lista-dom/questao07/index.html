<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 7</title>
</head>
<body>
    <h1 id="mensagem">Preencha o formulário para entrar em contato conosco.</h1>

    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required>

        <label for="mensagem">Mensagem:</label><br>
        <textarea id="mensagemInput" name="mensagem" placeholder="Digite sua mensagem" rows="4" cols="50" required></textarea>

        <button onclick="enviarFormulario()" type="submit">Enviar</button>

    <script src="script.js"></script>
</body>
</html>
